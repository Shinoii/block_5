services:
  nginx:
    image: nginx:latest
    container_name: nginx_app
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - app-network

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: php_app
    volumes:
      - .:/var/www
    networks:
      - app-network

  mysql:
    image: mysql:8.0
    container_name: mysql_app
    environment:
      MYSQL_DATABASE: effective
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: user
      MYSQL_PASSWORD: user
    ports:
      - "3307:3306"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge